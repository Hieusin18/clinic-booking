name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build

  web:
    # Bỏ qua các bước build cho đến khi thư mục web/ được khởi tạo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
      - if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build

  deploy:
    # Chỉ deploy khi code đã vào nhánh main và các job kiểm tra đều xanh
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy lên VPS qua SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/clinic-booking
            git pull --ff-only
            if [ -f web/package.json ]; then (cd web && npm ci && npm run build); fi
            docker compose up -d --build
            docker image prune -f
