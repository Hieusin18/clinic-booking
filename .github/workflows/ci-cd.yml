name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Biên dịch, chạy test JUnit trên CSDL test (Flyway áp dụng migration, Hibernate kiểm tra entity khớp bảng),
      # đóng gói app.jar và xuất độ phủ JaCoCo
      - name: Build và test (Maven)
        run: ./mvnw -B -ntp verify
      - name: Độ phủ test
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          [ -f "$f" ] && awk -F, 'NR>1 { m+=$8; c+=$9 } END { printf "Độ phủ dòng lệnh: %.1f%% (%d/%d dòng)\n", 100*c/(m+c), c, m+c }' "$f" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Báo cáo test khi lỗi
        if: failure()
        run: for f in target/surefire-reports/*.txt; do grep -q "FAILURE" "$f" && cat "$f"; done | head -300 || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
      - name: Build và test web
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build && npm test --if-present

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('mobile/package.json') != ''
        with:
          node-version: 22
      - name: Kiểm tra kiểu và test mobile
        if: hashFiles('mobile/package.json') != ''
        working-directory: mobile
        run: npm ci && npm run typecheck && npm test --if-present

  docker:
    # Dựng toàn bộ hệ thống như hôm demo (DOMAIN=:80) và kiểm tra nó thật sự chạy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Dựng db + backend + caddy
        run: |
          cp .env.example .env
          docker compose --profile tools build --progress plain > build.log 2>&1 || { tail -n 30 build.log; echo "::error title=build::$(tail -n 30 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; exit 1; }
          docker compose up -d --wait --wait-timeout 180
      - name: Tạo dữ liệu mẫu
        run: docker compose run --rm seed
      - name: Kiểm tra qua Caddy ở cổng 80
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost/api/health && break; sleep 2; done
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"phone":"0900000001","password":"123456"}' | grep -q accessToken
      - name: Luồng chính qua Caddy (cấp số, gọi số realtime, bệnh án PDF)
        run: |
          pip install --quiet "python-socketio[client]==5.13.0"
          python3 ci/smoke.py http://localhost
      - name: Giám sát Prometheus + Grafana
        # Dựng bộ giám sát cạnh hệ thống vừa chạy, kiểm tra mọi target up và mọi biểu đồ có dữ liệu
        run: bash monitoring/check.sh
      - name: Log khi lỗi
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 100
          # Gộp log thành một annotation để xem được ngay trên trang PR
          for s in backend caddy db; do
            echo "::error title=log $s::$(docker compose logs --no-color --tail 25 $s 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done
          M="docker compose -f monitoring/docker-compose.yml --env-file .env"
          for s in prometheus grafana cadvisor postgres-exporter; do
            echo "::error title=log $s::$($M logs --no-color --tail 15 $s 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done

  deploy:
    # Chỉ deploy khi code đã vào main, mọi job kiểm tra đều xanh và đã cấu hình VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [backend, web, mobile, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy lên VPS qua SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/clinic-booking
            git pull --ff-only
            if [ -f web/package.json ]; then (cd web && npm ci && npm run build); fi
            docker compose up -d --build
            docker image prune -f
