name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Kiểm tra schema
        run: npx prisma validate
      - run: npx prisma generate
      - name: Áp dụng migration vào CSDL test
        run: npx prisma migrate deploy
      - name: Migration phải khớp schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Kiểm tra kiểu (gồm cả test)
        run: npm run typecheck
      - run: npm run build
      - name: Chạy test
        run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
      - name: Build và test web
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci && npm run build && npm test --if-present

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('mobile/package.json') != ''
        with:
          node-version: 22
      - name: Kiểm tra kiểu và test mobile
        if: hashFiles('mobile/package.json') != ''
        working-directory: mobile
        run: npm ci && npm run typecheck && npm test --if-present

  docker:
    # Dựng toàn bộ hệ thống như hôm demo (DOMAIN=:80) và kiểm tra nó thật sự chạy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Dựng db + backend + caddy
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Tạo dữ liệu mẫu
        run: docker compose run --rm seed
      - name: Kiểm tra qua Caddy ở cổng 80
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost/api/health && break; sleep 2; done
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"phone":"0900000001","password":"123456"}' | grep -q accessToken
      - name: Log khi lỗi
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 100
          # Gộp log thành một annotation để xem được ngay trên trang PR
          for s in backend caddy db; do
            echo "::error title=log $s::$(docker compose logs --no-color --tail 25 $s 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done

  deploy:
    # Chỉ deploy khi code đã vào main, mọi job kiểm tra đều xanh và đã cấu hình VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [backend, web, mobile, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy lên VPS qua SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/clinic-booking
            git pull --ff-only
            if [ -f web/package.json ]; then (cd web && npm ci && npm run build); fi
            docker compose up -d --build
            docker image prune -f
