# Kiểm tra cấu hình máy CI (Jenkins + SonarQube) mỗi khi thư mục ci/ thay đổi
name: ci-tools

on:
  pull_request:
    paths: ["ci/**", ".github/workflows/ci-tools.yml"]
  push:
    branches: [main]
    paths: ["ci/**", ".github/workflows/ci-tools.yml"]

jobs:
  jenkins-sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dựng Jenkins + SonarQube
        run: docker compose -f ci/docker-compose.yml up -d --build
      - name: Jenkins có Docker CLI, Node 22 và plugin
        run: |
          docker compose -f ci/docker-compose.yml exec -T jenkins docker version
          docker compose -f ci/docker-compose.yml exec -T jenkins docker compose version
          docker compose -f ci/docker-compose.yml exec -T jenkins node -v
          docker compose -f ci/docker-compose.yml exec -T jenkins npm -v
          docker compose -f ci/docker-compose.yml exec -T jenkins ssh -V
          docker compose -f ci/docker-compose.yml exec -T jenkins ls /var/jenkins_home/plugins | grep -E '^(sonar|docker-workflow|ssh-agent|workflow-aggregator)\.jpi$'
      - name: Jenkins trả lời ở cổng 8080
        run: for i in $(seq 1 60); do curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/login | grep -q 200 && exit 0; sleep 3; done; exit 1
      - name: SonarQube lên trạng thái UP
        run: for i in $(seq 1 60); do s=$(curl -s http://localhost:9000/api/system/status | grep -o '"status":"[A-Z_]*"'); echo "$s"; echo "$s" | grep -q UP && exit 0; sleep 5; done; exit 1
      - name: Log khi lỗi
        if: failure()
        run: |
          docker compose -f ci/docker-compose.yml ps -a
          for s in jenkins sonarqube sonar-db; do
            echo "::error title=log $s::$(docker compose -f ci/docker-compose.yml logs --no-color --tail 25 $s 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done
