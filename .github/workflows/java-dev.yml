# Tạm thời trong lúc chuyển backend sang Spring Boot: build + test backend mỗi lần đẩy lên nhánh này
name: Java dev

on:
  push:
    branches: [java-spring-boot]

concurrency:
  group: java-dev
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build và test
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Tóm tắt lỗi
        if: failure()
        run: |
          grep -E "ERROR|FAIL|Tests run:.*Fail|expected|but was" build.log | head -150 || true
          for f in target/surefire-reports/*.txt; do grep -q "FAILURE" "$f" && cat "$f"; done | head -300 || true
