# Kiểm tra bộ cấu hình Kubernetes chạy thật: dựng cụm k3d, triển khai bằng đúng script của nhóm,
# tạo dữ liệu mẫu, chạy luồng chính (cấp số, gọi số realtime, bệnh án PDF) qua Ingress, rồi thử cập nhật.
name: k8s

on:
  pull_request:
    paths: &paths
      - "k8s/**"
      - "backend/**"
      - "web/**"
      - "Caddyfile"
      - "ci/smoke.py"
      - ".github/workflows/k8s.yml"
  push:
    branches: [main]
    paths: *paths

jobs:
  k3d:
    runs-on: ubuntu-latest
    env:
      K8S_HTTP_PORT: "8090"
    steps:
      - uses: actions/checkout@v4
      - name: Cài k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.4 bash
      - name: Build image
        run: |
          docker build -q -t clinic-backend:ci1 backend
          docker build -q -f web/Dockerfile -t clinic-web:ci1 .
      - name: Tạo cụm (k8s/up.sh)
        run: bash k8s/up.sh
      - name: Triển khai (k8s/deploy.sh)
        run: TAG=ci1 bash k8s/deploy.sh .env.example
      - name: Dữ liệu mẫu
        run: kubectl -n clinic exec deploy/backend -- java -jar app.jar seed
      - name: Luồng chính qua Ingress
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8090/api/health && break; sleep 2; done
          curl -fsS http://localhost:8090/ | grep -q '<div id="root">'
          pip install --quiet "python-socketio[client]==5.13.0"
          python3 ci/smoke.py http://localhost:8090
      - name: Cập nhật phiên bản mới, dữ liệu còn nguyên
        run: |
          docker tag clinic-backend:ci1 clinic-backend:ci2
          docker tag clinic-web:ci1 clinic-web:ci2
          TAG=ci2 bash k8s/deploy.sh .env.example
          kubectl -n clinic get deploy backend web -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' | tee images.txt
          grep -q clinic-backend:ci2 images.txt && grep -q clinic-web:ci2 images.txt
          # Dữ liệu mẫu vẫn còn sau khi pod backend được thay mới
          curl -fsS -X POST http://localhost:8090/api/auth/login -H 'Content-Type: application/json' \
            -d '{"phone":"0900000001","password":"123456"}' | grep -q accessToken
      - name: Xóa pod CSDL, dữ liệu vẫn còn (ổ đĩa PVC)
        run: |
          kubectl -n clinic delete pod db-0
          kubectl -n clinic rollout status statefulset/db --timeout=180s
          for i in $(seq 1 30); do
            curl -fsS -X POST http://localhost:8090/api/auth/login -H 'Content-Type: application/json' \
              -d '{"phone":"0900000001","password":"123456"}' | grep -q accessToken && exit 0
            sleep 3
          done
          exit 1
      - name: Log khi lỗi
        if: failure()
        run: |
          kubectl -n clinic get all,pvc,ingress -o wide || true
          kubectl -n clinic describe pods || true
          for d in backend web; do kubectl -n clinic logs deploy/$d --tail 80 || true; done
          kubectl -n clinic logs statefulset/db --tail 40 || true
