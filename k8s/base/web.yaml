# Web = Caddy + trang React đã build (image clinic-web), chuyển /api/* sang service backend:3000.
# Không giữ dữ liệu gì nên chạy 2 bản: một bản chết hay đang cập nhật thì bản kia vẫn phục vụ.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 2
  # Cập nhật cuốn chiếu: bật bản mới xong mới tắt bản cũ, người dùng không bị gián đoạn
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      enableServiceLinks: false
      containers:
        - name: caddy
          image: clinic-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # HTTPS do Ingress lo (nếu có); Caddy trong cụm chỉ phục vụ HTTP cổng 80
            - name: DOMAIN
              value: ":80"
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            # Caddy cần chỗ ghi cấu hình tạm; không cần giữ lại
            - { name: caddy-data, mountPath: /data }
            - { name: caddy-config, mountPath: /config }
      volumes:
        - { name: caddy-data, emptyDir: {} }
        - { name: caddy-config, emptyDir: {} }
