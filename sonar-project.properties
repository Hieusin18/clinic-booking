# Cấu hình quét SonarQube cho cả 3 phần (Jenkins gọi sonar-scanner ở thư mục gốc repo)
sonar.projectKey=clinic-booking
sonar.projectName=Hệ thống đặt lịch khám
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,web/src,mobile/src
sonar.tests=backend/test,web/src,mobile/src
sonar.test.inclusions=backend/test/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/generated/**,**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,web/src/test/**

# Độ phủ test do vitest --coverage sinh ra
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,web/coverage/lcov.info,mobile/coverage/lcov.info
