# Cấu hình quét SonarQube cho cả 3 phần (Jenkins gọi sonar-scanner ở thư mục gốc repo)
sonar.projectKey=clinic-booking
sonar.projectName=Hệ thống đặt lịch khám
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,web/src,mobile/src
sonar.tests=backend/src/test/java,web/src,mobile/src
sonar.test.inclusions=backend/src/test/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/generated/**,**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,web/src/test/**

# Backend Java (Spring Boot): SonarQube cần file .class do "mvnw verify" ở stage Test biên dịch ra
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Độ phủ test: JaCoCo (backend) và vitest --coverage (web, mobile)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,mobile/coverage/lcov.info

# Bảng mã ICD-10 là dữ liệu sinh sẵn, không phải logic
sonar.cpd.exclusions=backend/src/main/java/com/clinic/util/Icd10Data.java

# Test tự động của mobile chỉ chạy logic thuần (src/lib); màn hình React Native và phần tải/chia sẻ file
# dùng API gốc của thiết bị nên được kiểm tra tay trên Expo Go, không tính vào độ phủ
sonar.coverage.exclusions=mobile/src/app/**,mobile/src/components/**,mobile/src/lib/download.ts
