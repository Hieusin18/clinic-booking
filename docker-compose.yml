# Chạy toàn bộ hệ thống: docker compose up -d --build
# Biến môi trường lấy từ file .env cạnh file này (xem .env.example).
name: clinic-booking

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      QR_SECRET: ${QR_SECRET}
      QR_TTL_SECONDS: ${QR_TTL_SECONDS:-60}
      CLINIC_ID: ${CLINIC_ID}
      CLINIC_NAME: ${CLINIC_NAME:-}
      CLINIC_ADDRESS: ${CLINIC_ADDRESS:-}
      CLINIC_PHONE: ${CLINIC_PHONE:-}
      CLINIC_CODE: ${CLINIC_CODE:-}
      CHECKIN_EARLY_MINUTES: ${CHECKIN_EARLY_MINUTES:-}
      CHECKIN_LATE_MINUTES: ${CHECKIN_LATE_MINUTES:-}
      QUEUE_PRIORITY_LEAD_MINUTES: ${QUEUE_PRIORITY_LEAD_MINUTES:-}
      QUEUE_WALK_IN_EVERY: ${QUEUE_WALK_IN_EVERY:-}
      QUEUE_AVG_EXAM_MINUTES: ${QUEUE_AVG_EXAM_MINUTES:-}
      QUEUE_DAY_END_HOUR: ${QUEUE_DAY_END_HOUR:-}
      QUEUE_SWEEP_SECONDS: ${QUEUE_SWEEP_SECONDS:-}
      NO_SHOW_LIMIT: ${NO_SHOW_LIMIT:-}
      NO_SHOW_WINDOW_DAYS: ${NO_SHOW_WINDOW_DAYS:-}
      NO_SHOW_LOCK_DAYS: ${NO_SHOW_LOCK_DAYS:-}
      REMINDER_SWEEP_SECONDS: ${REMINDER_SWEEP_SECONDS:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      REQUIRE_PHONE_VERIFICATION: ${REQUIRE_PHONE_VERIFICATION:-}
      SMS_VERIFY_NUMBER: ${SMS_VERIFY_NUMBER:-}
      SMS_SIMULATOR: ${SMS_SIMULATOR:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_GATEWAY_SIGNING_KEY: ${SMS_GATEWAY_SIGNING_KEY:-}

  # Tạo dữ liệu mẫu (admin, bác sĩ, thuốc…) — chỉ chạy khi gọi tay, sau khi backend đã migrate:
  #   docker compose run --rm seed
  # Dùng stage "build" của Dockerfile vì seed cần tsx và mã nguồn (image chạy thật không có).
  seed:
    build:
      context: ./backend
      target: build
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["npx", "prisma", "db", "seed"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv/web:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
