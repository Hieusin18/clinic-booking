route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "9292043686:AAGD3gcwCjmrgbxj5v1EiWzpQRZ3AU3lsLc"
        chat_id: 7087510549
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🚨 CẢNH BÁO{{ else }}✅ ĐÃ KHÔI PHỤC{{ end }}
          {{ range .Alerts }}
          Tên: {{ .Labels.alertname }}
          Mức độ: {{ .Labels.severity }}
          Chi tiết: {{ .Annotations.summary }}
          {{ end }}
