# Triển khai bằng image đã build sẵn (Jenkins dùng file này cho laptop và VPS).
#   TAG=12 IMAGE_PREFIX=clinic docker compose -f docker-compose.prod.yml --env-file .env up -d
# Khác docker-compose.yml: không build, không mount thư mục code; web nằm sẵn trong image.
# Cùng tên project "clinic-booking" nên dùng chung dữ liệu (volume pgdata) với bản chạy tay.
name: clinic-booking

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX:-clinic}-backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      QR_SECRET: ${QR_SECRET}
      QR_TTL_SECONDS: ${QR_TTL_SECONDS:-60}
      CLINIC_ID: ${CLINIC_ID}

  # Dữ liệu mẫu, chỉ chạy khi gọi: docker compose -f docker-compose.prod.yml run --rm seed
  seed:
    image: ${IMAGE_PREFIX:-clinic}-backend-tools:${TAG:-latest}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["npx", "prisma", "db", "seed"]

  caddy:
    image: ${IMAGE_PREFIX:-clinic}-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
