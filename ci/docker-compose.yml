# Máy CI trên laptop nhóm: Jenkins (http://localhost:8080) + SonarQube (http://localhost:9000)
#   Bật:  docker compose -f ci/docker-compose.yml up -d --build
#   Tắt:  docker compose -f ci/docker-compose.yml down        (giữ dữ liệu)
# Tách riêng với docker-compose.yml của ứng dụng, chạy song song được.
name: clinic-ci

services:
  jenkins:
    build: ./jenkins
    # Chạy bằng root để dùng được Docker của máy qua docker.sock (chỉ dùng cho máy học tập)
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: -Xmx1g
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Bỏ yêu cầu chỉnh vm.max_map_count trên máy (Docker Desktop/WSL), đủ cho dự án nhỏ
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:
